name: "Build and test on OpenBSD"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REV: 3
  CURL_IMPERSONATE_VERSION: 2.2.2
  CURL_CFFI_VERSION: 0.16.3
  OPENBSD: 7.9

jobs:
  build-curlimpersonate:
    name: Build curl-impersonate on ${{ matrix.host_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm_arch: x86_64
            host_label: x86_64-openbsd
            platform_tag: amd64
          - vm_arch: aarch64
            host_label: aarch64-openbsd
            platform_tag: aarch64
          - vm_arch: riscv64
            host_label: riscv64-openbsd
            platform_tag: riscv64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Build
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ env.OPENBSD }}
          mem: 8192
          arch: ${{ matrix.vm_arch }}
          prepare: |
            pkg_add -Uu
            pkg_add git cmake ninja gmake
          run: |
            set -e
            git clone https://github.com/lexiforest/curl-impersonate
            cd curl-impersonate
            git checkout tags/v${{ env.CURL_IMPERSONATE_VERSION }}
            install_dir="$PWD/openbsd-install"
            artifacts_dir="$PWD/openbsd-artifacts"
            rm -rf build-openbsd "$install_dir" "$artifacts_dir"
            mkdir -p "$install_dir" "$artifacts_dir"

            patch < ${{ github.workspace }}/curl-impersonate.patch
            cmake_args="-G Ninja -DCMAKE_INSTALL_PREFIX=$install_dir"
            cmake_args="$cmake_args -DCURL_IMPERSONATE_CXX_RUNTIME_LIBRARY=c++abi\;pthread"
            gmake configure BUILD_DIR=build-openbsd CMAKE_CONFIGURE_ARGS="$cmake_args"
            gmake build BUILD_DIR=build-openbsd CMAKE_CONFIGURE_ARGS="$cmake_args"
            gmake checkbuild BUILD_DIR=build-openbsd

            gmake install-strip BUILD_DIR=build-openbsd CMAKE_CONFIGURE_ARGS="$cmake_args"

            install_lib_dir="$install_dir/lib"
            deps_lib_dir="$PWD/build-openbsd/deps/install/lib"
            deps_libs="libz.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a"
            for lib in $deps_libs; do
              cp "$deps_lib_dir/$lib" "$install_lib_dir/"
            done
            cd "$install_lib_dir"
            mv libcurl-impersonate.a libcurl-impersonate.orig.a
            cc -r -o libcurl-impersonate.full.o -Wl,--whole-archive libcurl-impersonate.orig.a $deps_libs -Wl,--no-whole-archive
            ar rcs libcurl-impersonate.a libcurl-impersonate.full.o
            rm -f libcurl-impersonate.full.o $deps_libs libcurl-impersonate.orig.a

            tar -czf "$artifacts_dir/libcurl-impersonate-${{ env.CURL_IMPERSONATE_VERSION }}.${{ matrix.host_label }}.tar.gz" lib* -C "$install_dir" include LICENSE LICENSE_BORINGSSL LICENSE_BROTLI LICENSE_CURL LICENSE_NGHTTP2 LICENSE_NGHTTP3 LICENSE_NGTCP2 LICENSE_ZLIB LICENSE_ZSTD
            cd "$install_dir/bin"
            tar -czf "$artifacts_dir/curl-impersonate-${{ env.CURL_IMPERSONATE_VERSION }}.${{ matrix.host_label }}.tar.gz" curl-impersonate curl_*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: curl-impersonate.${{ matrix.host_label }}
          path: |
            curl-impersonate/openbsd-artifacts/*.tar.gz

  build-curlcffi:
    name: Build curl_cffi on ${{ matrix.host_label }}
    needs: build-curlimpersonate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm_arch: x86_64
            host_label: x86_64-openbsd
            platform_tag: amd64
          - vm_arch: aarch64
            host_label: aarch64-openbsd
            platform_tag: aarch64
          - vm_arch: riscv64
            host_label: riscv64-openbsd
            platform_tag: riscv64
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: curl-impersonate.${{ matrix.host_label }}
          path: release-assets

      - name: Build
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ env.OPENBSD }}
          mem: 8192
          arch: ${{ matrix.vm_arch }}
          envs: "GH_TOKEN"
          prepare: |
            pkg_add -Uu
            pkg_add git python%3
          run: |
            cd release-assets
            tar xzf libcurl-impersonate-${{ env.CURL_IMPERSONATE_VERSION }}.${{ matrix.host_label }}.tar.gz
            curl_impersonate_dir=$PWD
            cd ..
            python3 -m venv .venv
            . .venv/bin/activate
            python3 -m pip install --upgrade pip
            ftp https://github.com/lexiforest/curl_cffi/releases/download/v${{ env.CURL_CFFI_VERSION }}/curl_cffi-${{ env.CURL_CFFI_VERSION }}.tar.gz
            tar xzf curl_cffi-${{ env.CURL_CFFI_VERSION }}.tar.gz
            cd curl_cffi-${{ env.CURL_CFFI_VERSION }}
            patch < ${{ github.workspace }}/curl_cffi.patch
            python3 -m pip install build $(python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['build-system']['requires']))")
            env CFLAGS="-I$curl_impersonate_dir/include" IMPERSONATE_BUILD_DIR="$curl_impersonate_dir" python3 -m build -w
            # Compat with -current
            # There's no guarantee that a wheel built on -release will
            # actually work on -current
            python3 -m wheel tags --platform-tag="+openbsd_8_0_${{ matrix.platform_tag }}" --remove dist/*.whl
            deactivate

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: curl_cffi.${{ matrix.host_label }}
          path: |
            curl_cffi-${{ env.CURL_CFFI_VERSION }}/dist/*.whl

  test:
    name: Test curl_cffi on x86_64
    needs: build-curlcffi
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: curl_cffi.x86_64-openbsd
          path: release-assets

      - name: Test
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ env.OPENBSD }}
          mem: 8192
          arch: x86_64
          envs: "GH_TOKEN"
          prepare: |
            pkg_add -Uu
            pkg_add git python%3 github-cli
          run: |
            python3 -m venv .venv
            . .venv/bin/activate
            python3 -m pip install --upgrade pip
            git config --global --add safe.directory "${{ github.workspace }}"
            gh run download $(gh run list --workflow test_dependencies.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId') --name artifacts
            python3 -m pip install cryptography/dist/*.whl release-assets/curl_cffi/dist/*.whl
            git clone https://github.com/lexiforest/curl_cffi
            cd curl_cffi
            git checkout tags/v${{ env.CURL_CFFI_VERSION }}
            python3 -m pip install $(python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['test']))")
            cd
            python3 -bb -m pytest ${{ github.workspace }}/curl_cffi/tests/unittest --ignore=${{ github.workspace }}/curl_cffi/tests/unittest/test_async_websockets.py
            deactivate

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: |
            curl-impersonate.*
            curl_cffi.*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "r${{ env.REV }}" \
            --title "r${{ env.REV }}: ${{ env.CURL_IMPERSONATE_VERSION }}+${{ env.CURL_CFFI_VERSION }}" \
            --generate-notes \
            release-assets/curl-impersonate/openbsd-artifacts/*.tar.gz \
            release-assets/curl_cffi/dist/*.whl
