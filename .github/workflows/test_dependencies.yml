name: "Prepare dependencies for curl_cffi test"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MATURIN_OPENSSL_SYS_VERSION: 0.9.116
  CRYPTOGRAPHY_OPENSSL_SYS_VERSION: 0.9.110

jobs:
  build:
    name: Build cryptography on ${{ matrix.vm_arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - vm_arch: x86_64
          - vm_arch: aarch64
          - vm_arch: riscv64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: "7.9"
          mem: 8192
          arch: ${{ matrix.vm_arch }}
          prepare: |
            pkg_add -Uu
            pkg_add python%3 rust
          run: |
            set -e
            for ver in ${{ env.MATURIN_OPENSSL_SYS_VERSION }} ${{ env.CRYPTOGRAPHY_OPENSSL_SYS_VERSION }}; do
              cd ${{ github.workspace }}
              ftp https://static.crates.io/crates/openssl-sys/openssl-sys-$ver.crate
              tar xzf openssl-sys-$ver.crate
              cd openssl-sys-$ver
              # https://github.com/libressl/portable/blob/master/.github/workflows/rust-openssl.yml
              # https://github.com/rust-openssl/rust-openssl/issues/1997
              ed -s build/main.rs << 'EOF'
            /_ => version_error/-1
            .t.
            s/(.*=/_ =
            +1d
            w
            q
            EOF
            done

            cd ${{ github.workspace }}
            python3 -m venv .venv
            . .venv/bin/activate
            python3 -m pip install --upgrade pip
            python3 -m pip install wheel build
            python3 -m pip download --no-binary maturin --no-binary cryptography maturin "cryptography>=46.0.4,<47.0"
            tar xzf maturin-*.tar.gz
            tar xzf cryptography-*.tar.gz
            rm maturin-*.tar.gz cryptography-*.tar.gz
            mv maturin-* maturin
            mv cryptography-* cryptography
            cd maturin
            patch < ${{ github.workspace }}/maturin.patch
            mkdir -p .cargo
            cat << 'EOF' >> .cargo/config.toml
            [patch.crates-io]
            openssl-sys = { path = "${{ github.workspace }}/openssl-sys-${{ env.MATURIN_OPENSSL_SYS_VERSION }}", package = "openssl-sys" }
            EOF
            cargo update -p openssl-sys --precise ${{ env.MATURIN_OPENSSL_SYS_VERSION }}
            python3 -m pip wheel . -w .
            python3 -m pip install maturin*.whl
            cd ${{ github.workspace }}/cryptography
            mkdir -p .cargo
            cat << 'EOF' >> .cargo/config.toml
            [patch.crates-io]
            openssl-sys = { path = "${{ github.workspace }}/openssl-sys-${{ env.CRYPTOGRAPHY_OPENSSL_SYS_VERSION }}", package = "openssl-sys" }
            EOF
            cargo update --manifest-path src/rust/Cargo.toml -p openssl-sys --precise ${{ env.CRYPTOGRAPHY_OPENSSL_SYS_VERSION }}
            python3 -m build --wheel

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts.${{ matrix.vm_arch }}
          path: |
            cryptography/dist/*.whl
