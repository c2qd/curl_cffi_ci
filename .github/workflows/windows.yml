name: "Build with MinGW-w64 and test"

on:
  workflow_dispatch:

permissions: {}

env:
  LLVM_MINGW_V: "20260922"
  GCC_MINGW_V: "gcc-16"
  GCC_WIN_V: "16.2.0"
  GCC_MINGW_WIN_V: "rt_v14-rev1"
  PR336_COMMIT: 190caf97aec24cff22bad563ee26e873c8cc07c5

jobs:
  build:
    name: Build on Ubuntu (${{ matrix.toolchain }}, ${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [x86_64, i686, aarch64, armv7]
        toolchain: [clang, gcc]
        exclude:
          - arch: aarch64
            toolchain: gcc
          - arch: armv7
            toolchain: gcc
    env:
      MINGW_TOOLCHAIN: "${{ matrix.toolchain }}"
      MINGW_ARCH: "${{ matrix.arch }}"
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make cmake ninja-build curl xz-utils git
          if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install nasm wine wine64 wine32 patch
          fi

      - name: Install MinGW toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = "clang" ]; then
            curl -fsSL -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_V }}/llvm-mingw-${{ env.LLVM_MINGW_V }}-ucrt-ubuntu-22.04-x86_64.tar.xz
            sudo mkdir -p /opt/llvm-mingw
            sudo tar -xJf llvm-mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw
            echo "MINGW_ROOT=/opt/llvm-mingw" >> "$GITHUB_ENV"
          elif [ "${{ matrix.toolchain }}" = "gcc" ]; then
            curl -fsSL -o gcc-mingw.tar.xz https://github.com/AmanoTeam/mingw-gcc-cross/releases/download/${{ env.GCC_MINGW_V }}/x86_64-unknown-linux-gnu.tar.xz
            sudo mkdir -p /opt/gcc-mingw
            sudo tar -xJf gcc-mingw.tar.xz --strip-components=1 -C /opt/gcc-mingw
            echo "MINGW_ROOT=/opt/gcc-mingw" >> "$GITHUB_ENV"
          fi

      - name: Clone the repo
        run: |
          git clone https://github.com/c2qd/curl-impersonate.git
          cd curl-impersonate
          git switch feature/mingw
          git cherry-pick --no-commit ${{ env.PR336_COMMIT }}

      - name: Build
        run: |
          cd curl-impersonate
          export CMAKE_CONFIGURE_ARGS="-DCMAKE_INSTALL_PREFIX=./install"
          export USE_WINE=1
          ./scripts/mingw.sh build
          if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
            ./scripts/mingw.sh checkbuild
          fi
          ./scripts/mingw.sh install-strip

      - name: Create the static lib
        run: |
          depslib_list="libcares.a libzlibstatic.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a"
          cd curl-impersonate
          for lib in $depslib_list; do
            cp "build/deps/install/lib/$lib" install/lib
          done
          cd install/lib
          mv libcurl-impersonate.a{,.orig}
          {
            echo "CREATE libcurl-impersonate.a"
            echo "ADDLIB libcurl-impersonate.a.orig"
            for lib in $depslib_list; do
              echo "ADDLIB $lib"
            done
            echo "SAVE"
          } | "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-ar" -M
          rm -f $depslib_list *.orig

      - name: Build a sample program
        run: |
          cd curl-impersonate
          cp ${{ github.workspace }}/sample.* .
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-${{ matrix.toolchain }}" -I./install/include sample.c -L./install/lib -lcurl-impersonate -o install/lib/c_d.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-c++" -I./install/include sample.cpp -L./install/lib -lcurl-impersonate -o install/lib/cpp_d.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-${{ matrix.toolchain }}" -DCURL_STATICLIB -I./install/include sample.c -L./install/lib -static -lcurl-impersonate -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -o install/lib/c_s.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-c++" -DCURL_STATICLIB -I./install/include sample.cpp -L./install/lib -lcurl-impersonate -static -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -o install/lib/cpp_s.exe

      - name: Make tarball
        run: |
          cd curl-impersonate
          tar -C install -czf "curl-impersonate.tgz" .

      - name: Upload artifact
        if: ${{ ! (matrix.toolchain == 'clang' && matrix.arch == 'armv7') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts.ubuntu.${{ matrix.arch }}.${{ matrix.toolchain }}
          path: curl-impersonate/curl-impersonate.tgz

  build-w:
    name: Build on Windows (${{ matrix.toolchain }}, ${{ matrix.arch }}, ${{ matrix.script }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, i686, aarch64, armv7]
        toolchain: [clang, gcc]
        script: [sh, bat]
        exclude:
          - arch: aarch64
            toolchain: gcc
          - arch: armv7
            toolchain: gcc
    env:
      MINGW_ARCH: ${{ matrix.arch }}
      MINGW_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ matrix.script }}" = "sh" ]; then
            choco install make
          fi
          if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
            choco install nasm
          fi

      - name: Install MinGW toolchain
        shell: bash
        run: |
          mkdir toolchain
          cd toolchain
          if [ "${{ matrix.toolchain }}" = "clang" ]; then
            curl -fsSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_V }}/llvm-mingw-${{ env.LLVM_MINGW_V }}-ucrt-x86_64.zip
            7z x llvm-mingw.zip
            rm -f llvm-mingw.zip
            mingw_path=$(realpath llvm-mingw-*)
          elif [ "${{ matrix.toolchain }}" = "gcc" ]; then
            if [ "${{ matrix.arch }}" = "x86_64" ]; then
              exception="seh"
            elif [ "${{ matrix.arch }}" = "i686" ]; then
              exception="dwarf"
            fi
            curl -fsSL -o gcc-mingw.7z https://github.com/niXman/mingw-builds-binaries/releases/download/${{ env.GCC_WIN_V }}-${{ env.GCC_MINGW_WIN_V }}/${{ matrix.arch }}-${{ env.GCC_WIN_V }}-release-posix-$exception-ucrt-${{ env.GCC_MINGW_WIN_V }}.7z
            7z x gcc-mingw.7z
            rm -f gcc-mingw.7z
            mingw_path=$(realpath mingw*)
          fi
          if [ "${{ matrix.script }}" = "bat" ]; then
            mingw_path="$(cygpath -d $mingw_path)"
          fi
          echo "MINGW_ROOT=$mingw_path" >> $GITHUB_ENV

      - name: Clone the repo
        shell: bash
        run: |
          git clone https://github.com/c2qd/curl-impersonate.git
          cd curl-impersonate
          git switch feature/mingw
          git cherry-pick --no-commit $PR336_COMMIT

      - name: Build
        shell: bash
        run: |
          cd curl-impersonate
          if [ "${{ matrix.script }}" = "sh" ]; then
            export CMAKE_CONFIGURE_ARGS="-DCMAKE_INSTALL_PREFIX=./packages"
            ./scripts/mingw.sh build
            if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
              ./scripts/mingw.sh checkbuild
            fi
            ./scripts/mingw.sh install-strip
          elif [ "${{ matrix.script }}" = "bat" ]; then
            ./win/mingw-build.bat ${{ matrix.toolchain }} ${{ matrix.arch }} "$MINGW_ROOT"
          fi

      - name: Create the static lib
        shell: bash
        run: |
          depslib_list="libcares.a libzlibstatic.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a"
          cd curl-impersonate
          for lib in $depslib_list; do
            cp "build/deps/install/lib/$lib" packages/lib
          done
          cd packages/lib
          mv libcurl-impersonate.a{,.orig}
          {
            echo "CREATE libcurl-impersonate.a"
            echo "ADDLIB libcurl-impersonate.a.orig"
            for lib in $depslib_list; do
              echo "ADDLIB $lib"
            done
            echo "SAVE"
          } | "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-ar" -M
          rm -f $depslib_list *.orig

      - name: Build a sample program
        shell: bash
        run: |
          cd curl-impersonate
          cp "$GITHUB_WORKSPACE"/sample.* .
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-${{ matrix.toolchain }}" -I./packages/include sample.c -L./packages/lib -lcurl-impersonate -o packages/lib/c_d.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-c++" -I./packages/include sample.cpp -L./packages/lib -lcurl-impersonate -o packages/lib/cpp_d.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-${{ matrix.toolchain }}" -DCURL_STATICLIB -I./packages/include sample.c -L./packages/lib -lcurl-impersonate -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -static -o packages/lib/c_s.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-c++" -DCURL_STATICLIB -I./packages/include sample.cpp -L./packages/lib -lcurl-impersonate -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -static -o packages/lib/cpp_s.exe

      - name: Make tarball
        shell: bash
        run: |
          cd curl-impersonate
          tar -C packages -czf curl-impersonate.tgz .

      - name: Upload artifact
        if: ${{ ! (matrix.toolchain == 'clang' && matrix.arch == 'armv7') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts.windows-${{ matrix.script }}.${{ matrix.arch }}.${{ matrix.toolchain }}
          path: curl-impersonate/curl-impersonate.tgz

  test:
    name: Test (${{ matrix.built_on }}, ${{ matrix.toolchain }}, ${{ matrix.arch }})
    needs: [build, build-w]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - built_on: ubuntu
            arch: x86_64
            toolchain: clang
            os: windows-latest
          - built_on: ubuntu
            arch: x86_64
            toolchain: gcc
            os: windows-latest
          - built_on: ubuntu
            arch: i686
            toolchain: clang
            os: windows-latest
          - built_on: ubuntu
            arch: i686
            toolchain: gcc
            os: windows-latest
          - built_on: ubuntu
            arch: aarch64
            toolchain: clang
            os: windows-11-arm
          - built_on: windows-bat
            arch: x86_64
            toolchain: clang
            os: windows-latest
          - built_on: windows-sh
            arch: x86_64
            toolchain: clang
            os: windows-latest
          - built_on: windows-bat
            arch: x86_64
            toolchain: gcc
            os: windows-latest
          - built_on: windows-sh
            arch: x86_64
            toolchain: gcc
            os: windows-latest
          - built_on: windows-bat
            arch: i686
            toolchain: clang
            os: windows-latest
          - built_on: windows-sh
            arch: i686
            toolchain: clang
            os: windows-latest
          - built_on: windows-bat
            arch: i686
            toolchain: gcc
            os: windows-latest
          - built_on: windows-sh
            arch: i686
            toolchain: gcc
            os: windows-latest
          - built_on: windows-bat
            arch: aarch64
            toolchain: clang
            os: windows-11-arm
          - built_on: windows-sh
            arch: aarch64
            toolchain: clang
            os: windows-11-arm
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts.${{ matrix.built_on }}.${{ matrix.arch }}.${{ matrix.toolchain }}

      - name: Extract
        shell: bash
        run: |
          tar -xzf curl-impersonate.tgz

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          echo "===Info==="
          ./bin/curl-impersonate.exe -V
          echo "=========="
          for exe in "./bin/curl_chrome150.bat -fsS --ca-native https://kittens.sh/api/clean" "./lib/c_d.exe" "./lib/cpp_d.exe" "./lib/c_s.exe" "./lib/cpp_s.exe"; do
            if $exe | jq -e --slurpfile expected "$GITHUB_WORKSPACE/fp.json" '. as $actual | $expected[0].chrome150[] | select(.ja4 == $actual.ja4 and .akamai_hash == $actual.akamai_hash and .user_agent == $actual.user_agent)' >/dev/null; then
              echo "Ok $exe"
            else
              echo "Failed $exe"
              exit 1
            fi
          done

  rm-artifacts:
    if: always()
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Remove artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
          --paginate \
          "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
          --jq '.artifacts[].id' |
          while read -r id; do
            gh api \
            --method DELETE \
            "/repos/${{ github.repository }}/actions/artifacts/$id"
          done
