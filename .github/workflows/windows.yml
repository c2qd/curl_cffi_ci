name: "Build with LLVM/MinGW-w64 and test"

on:
  workflow_dispatch:

permissions: {}

env:
  LLVM_MINGW_V: "20260922"

jobs:
  build:
    name: Build on Ubuntu (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [x86_64, i686, aarch64, armv7]
    env:
      MINGW_TOOLCHAIN: "clang"
      MINGW_ARCH: "${{ matrix.arch }}"
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make cmake ninja-build curl xz-utils git
          if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install nasm wine wine64 wine32 patch
          fi

      - name: Install MinGW toolchain
        run: |
          curl -fsSL -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_V }}/llvm-mingw-${{ env.LLVM_MINGW_V }}-ucrt-ubuntu-22.04-x86_64.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw
          echo "MINGW_ROOT=/opt/llvm-mingw" >> "$GITHUB_ENV"

      - name: Clone the repo
        run: |
          git clone https://github.com/c2qd/curl-impersonate.git
          cd curl-impersonate
          git switch feature/mingw

      - name: Build
        run: |
          cd curl-impersonate
          export CMAKE_CONFIGURE_ARGS="-DCMAKE_INSTALL_PREFIX=./install"
          export USE_WINE=1
          ./scripts/mingw.sh build
          if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
            ./scripts/mingw.sh checkbuild
          fi
          ./scripts/mingw.sh install-strip

      - name: Create the static lib
        run: |
          depslib_list="libcares.a libzlibstatic.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a"
          cd curl-impersonate
          for lib in $depslib_list; do
            cp "build/deps/install/lib/$lib" install/lib
          done
          cd install/lib
          mv libcurl-impersonate.a{,.orig}
          {
            echo "CREATE libcurl-impersonate.a"
            echo "ADDLIB libcurl-impersonate.a.orig"
            for lib in $depslib_list; do
              echo "ADDLIB $lib"
            done
            echo "SAVE"
          } | "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-ar" -M
          rm -f $depslib_list *.orig

      - name: Build a sample program
        run: |
          cd curl-impersonate
          cp ${{ github.workspace }}/sample.* .
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang" -I./install/include sample.c -L./install/lib -lcurl-impersonate -o install/lib/c_d.exe
          # "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang++" -I./install/include sample.cpp -L./install/lib -lcurl-impersonate -o install/lib/cpp_d.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang++" -x c -DCURL_STATICLIB -I./install/include sample.c -L./install/lib -static -lcurl-impersonate -lpthread -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -o install/lib/c_s.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang++" -DCURL_STATICLIB -I./install/include sample.cpp -L./install/lib -lcurl-impersonate -static -lpthread -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -o install/lib/cpp_s.exe

      - name: Make tarball
        run: |
          cd curl-impersonate
          tar -C install -czf "curl-impersonate.tgz" .

      - name: Upload artifact
        if: ${{ matrix.arch != 'armv7' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts.ubuntu.${{ matrix.arch }}
          path: curl-impersonate/curl-impersonate.tgz

  build-w:
    name: Build on Windows (${{ matrix.arch }}, ${{ matrix.script }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, i686, aarch64, armv7]
        script: [sh, bat]
    env:
      MINGW_TOOLCHAIN: "clang"
      MINGW_ARCH: "${{ matrix.arch }}"
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ matrix.script }}" = "sh" ]; then
            choco install make
          fi
          if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
            choco install nasm
          fi

      - name: Install MinGW toolchain
        shell: bash
        run: |
          mkdir toolchain
          cd toolchain
          curl -fsSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_V }}/llvm-mingw-${{ env.LLVM_MINGW_V }}-ucrt-x86_64.zip
          7z x llvm-mingw.zip
          rm -f llvm-mingw.zip
          mingw_path=$(realpath llvm-mingw-*)
          if [ "${{ matrix.script }}" = "bat" ]; then
            mingw_path="$(cygpath -d $mingw_path)"
          fi
          echo "MINGW_ROOT=$mingw_path" >> $GITHUB_ENV

      - name: Clone the repo
        shell: bash
        run: |
          git clone https://github.com/c2qd/curl-impersonate.git
          cd curl-impersonate
          git switch feature/mingw

      - name: Build
        shell: bash
        run: |
          cd curl-impersonate
          if [ "${{ matrix.script }}" = "sh" ]; then
            export CMAKE_CONFIGURE_ARGS="-DCMAKE_INSTALL_PREFIX=./packages"
            ./scripts/mingw.sh build
            if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "i686" ]; then
              ./scripts/mingw.sh checkbuild
            fi
            ./scripts/mingw.sh install-strip
          elif [ "${{ matrix.script }}" = "bat" ]; then
            ./win/mingw-build.bat clang ${{ matrix.arch }} "$MINGW_ROOT"
          fi

      - name: Create the static lib
        shell: bash
        run: |
          depslib_list="libcares.a libzlibstatic.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a"
          cd curl-impersonate
          for lib in $depslib_list; do
            cp "build/deps/install/lib/$lib" packages/lib
          done
          cd packages/lib
          mv libcurl-impersonate.a{,.orig}
          {
            echo "CREATE libcurl-impersonate.a"
            echo "ADDLIB libcurl-impersonate.a.orig"
            for lib in $depslib_list; do
              echo "ADDLIB $lib"
            done
            echo "SAVE"
          } | "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-ar" -M
          rm -f $depslib_list *.orig

      - name: Build a sample program
        shell: bash
        run: |
          cd curl-impersonate
          cp "$GITHUB_WORKSPACE"/sample.* .
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang" -I./packages/include sample.c -L./packages/lib -lcurl-impersonate -o packages/lib/c_d.exe
          # "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang++" -I./packages/include sample.cpp -L./packages/lib -lcurl-impersonate -o packages/lib/cpp_d.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang++" -DCURL_STATICLIB -I./packages/include sample.c -L./packages/lib -lcurl-impersonate -lpthread -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -static -o packages/lib/c_s.exe
          "${MINGW_ROOT}/bin/${{ matrix.arch }}-w64-mingw32-clang++" -DCURL_STATICLIB -I./packages/include sample.cpp -L./packages/lib -lcurl-impersonate -lpthread -lnormaliz -lbcrypt -lcrypt32 -lws2_32 -liphlpapi -lkernel32 -ladvapi32 -static -o packages/lib/cpp_s.exe

      - name: Make tarball
        shell: bash
        run: |
          cd curl-impersonate
          tar -C packages -czf curl-impersonate.tgz .

      - name: Upload artifact
        if: ${{ matrix.arch != 'armv7' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts.windows-${{ matrix.script }}.${{ matrix.arch }}
          path: curl-impersonate/curl-impersonate.tgz

  test:
    name: Test (${{ matrix.built_on }}, ${{ matrix.arch }})
    needs: [build, build-w]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - built_on: ubuntu
            arch: x86_64
            os: windows-latest
          - built_on: ubuntu
            arch: i686
            os: windows-latest
          - built_on: ubuntu
            arch: aarch64
            os: windows-11-arm
          - built_on: windows-bat
            arch: x86_64
            os: windows-latest
          - built_on: windows-sh
            arch: x86_64
            os: windows-latest
          - built_on: windows-bat
            arch: i686
            os: windows-latest
          - built_on: windows-sh
            arch: i686
            os: windows-latest
          - built_on: windows-bat
            arch: aarch64
            os: windows-11-arm
          - built_on: windows-sh
            arch: aarch64
            os: windows-11-arm
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts.${{ matrix.built_on }}.${{ matrix.arch }}

      - name: Extract
        shell: bash
        run: |
          tar -xzf curl-impersonate.tgz

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          echo "===Info==="
          ./bin/curl-impersonate.exe -V
          echo "=========="
          for exe in "./bin/curl_chrome150.bat -fsS --ca-native https://kittens.sh/api/clean" "./lib/c_d.exe" "./lib/c_s.exe" "./lib/cpp_s.exe"; do
            if $exe | jq -e --slurpfile expected "$GITHUB_WORKSPACE/fp.json" '. as $actual | $expected[0].chrome150[] | select(.ja4 == $actual.ja4 and .akamai_hash == $actual.akamai_hash and .user_agent == $actual.user_agent)' >/dev/null; then
              echo "Ok $exe"
            else
              echo "Failed $exe"
              exit 1
            fi
          done

  rm-artifacts:
    if: always()
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Remove artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
          --paginate \
          "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
          --jq '.artifacts[].id' |
          while read -r id; do
            gh api \
            --method DELETE \
            "/repos/${{ github.repository }}/actions/artifacts/$id"
          done
