name: "Build with MinGW-w64"

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build on Ubuntu (${{ matrix.arch }}, ${{ matrix.toolchain }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [x86_64, i686, aarch64]
        toolchain: [clang, gcc]
        exclude:
          - arch: aarch64
            toolchain: gcc
    env:
      ARCH: ${{ matrix.arch }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make cmake ninja-build nasm curl xz-utils git

      - name: Install llvm-mingw
        if: matrix.toolchain == 'clang'
        run: |
          curl -fsSL -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw

      - name: Install GCC (mingw-w64, for x86_64)
        if: matrix.toolchain == 'gcc' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get install mingw-w64{,-common,-tools,-ucrt64-dev}

      - name: Install GCC (mingw-w64, for i686)
        if: matrix.toolchain == 'gcc' && matrix.arch == 'i686'
        run: |
          sudo apt install mingw-w64{,-common,-tools,-i686-dev}

      - name: Build
        run: |
          git clone https://github.com/c2qd/curl-impersonate.git
          cd curl-impersonate
          git switch feature/mingw
          git cherry-pick --no-commit 4c2a84f850ad3dd5418ce3946ff276d031521a8a
          if [ "${{ matrix.toolchain }}" = "clang" ]; then
             export MINGW_ROOT="/opt/llvm-mingw"
          fi
          CMAKE_CONFIGURE_ARGS="-DCMAKE_INSTALL_PREFIX=./install" ./scripts/mingw.sh
          tar -C install -czf "curl-impersonate.tgz" .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts.${{ matrix.arch }}.${{ matrix.toolchain }}
          path: curl-impersonate/curl-impersonate.tgz

  build-w:
    name: Build and test on Windows (${{ matrix.arch }}, ${{ matrix.toolchain }}, ${{ matrix.script }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, i686, aarch64]
        toolchain: [clang, gcc]
        script: [sh, bat]
        exclude:
          - arch: aarch64
            toolchain: gcc
    env:
      ARCH: ${{ matrix.arch }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Install dependencies
        shell: pwsh
        run: |
          choco install nasm

      - name: Install dependencies (sh)
        shell: pwsh
        run: |
          choco install make

      - name: Install llvm-mingw
        if: matrix.toolchain == 'clang'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-x86_64.zip -OutFile llvm-mingw.zip
          7z x llvm-mingw.zip
          $path = (Get-ChildItem -Directory -Path .\llvm-mingw-* | Select-Object -First 1).FullName
          if ("${{ matrix.script }}" -eq "sh") {
            $path = $path -replace '^([A-Za-z]):', '/$1' -replace '\\', '/'
          }
          echo "MINGW_ROOT=$path" >> $env:GITHUB_ENV

      - name: Install GCC/MinGW-w64 (niXman/mingw-builds-binaries)
        if: matrix.toolchain == 'gcc'
        shell: pwsh
        run: |
          $exception = if ("${{ matrix.arch }}" -eq "i686") { "dwarf" } else { "seh" }
          Invoke-WebRequest -Uri https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/${{ matrix.arch }}-16.2.0-release-mcf-$exception-ucrt-rt_v14-rev1.7z -OutFile mingw.7z
          7z x mingw.7z
          $path = (Get-ChildItem -Directory -Filter 'mingw*' | Select-Object -First 1).FullName
          if ("${{ matrix.script }}" -eq "sh") {
            $path = $path -replace '^([A-Za-z]):', '/$1' -replace '\\', '/'
          }
          echo "MINGW_ROOT=$path" >> $env:GITHUB_ENV

      - name: Clone the repo
        shell: pwsh
        run: |
          git clone https://github.com/c2qd/curl-impersonate.git
          cd curl-impersonate
          git switch feature/mingw
          git cherry-pick --no-commit 4c2a84f850ad3dd5418ce3946ff276d031521a8a

      - name: Build via scripts/mingw.sh
        if: matrix.script == 'sh'
        shell: bash
        run: |
          cd curl-impersonate
          CMAKE_CONFIGURE_ARGS="-DCMAKE_INSTALL_PREFIX=./packages" ./scripts/mingw.sh

      - name: Build via win/mingw-build.bat
        if: matrix.script == 'bat'
        shell: pwsh
        run: |
          cd curl-impersonate
          .\win\mingw-build.bat ${{ matrix.toolchain }} ${{ matrix.arch }} "$env:MINGW_ROOT"

      - name: Test
        shell: pwsh
        run: |
          cd curl-impersonate
          .\packages\bin\curl-impersonate.exe -V
          foreach ($wrapper in Get-ChildItem .\packages\bin\*.bat) {
            echo $wrapper.FullName
            & $wrapper.FullName --ca-native https://tls.browserleaks.com
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  test:
    name: Test
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - arch: x86_64
          toolchain: clang
          os: windows-latest
        - arch: x86_64
          toolchain: gcc
          os: windows-latest
        - arch: i686
          toolchain: clang
          os: windows-latest
        - arch: i686
          toolchain: gcc
          os: windows-latest
        - arch: aarch64
          toolchain: clang
          os: windows-11-arm
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts.${{ matrix.arch }}.${{ matrix.toolchain }}

      - name: Extract
        shell: bash
        run: |
          tar -xzf curl-impersonate.tgz

      - name: Test
        shell: pwsh
        run: |
          .\bin\curl-impersonate.exe -V
          foreach ($wrapper in Get-ChildItem bin\*.bat) {
            echo $wrapper.FullName
            & $wrapper.FullName --ca-native https://tls.browserleaks.com
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
